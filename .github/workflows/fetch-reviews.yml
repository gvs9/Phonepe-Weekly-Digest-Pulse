name: Fetch Weekly Reviews

on:
  schedule:
    - cron: '0 0 * * 0' # Runs at 00:00 UTC every Sunday
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write # Needed to commit the fetched data back to the repo

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Runs the full pipeline (Phases 1 through 6)
          python main.py

      - name: Commit and push updated reviews
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: fetch weekly latest reviews" || echo "No new reviews to commit"
          git push
